name: CI

on:
  push:
  pull_request:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run build and checks
        run: ./gradlew :konfetti:core:jvmTest :konfetti:compose:testAndroidHostTest :konfetti:xml:testDebugUnitTest spotlessCheck apiCheck assembleDebug --console=plain

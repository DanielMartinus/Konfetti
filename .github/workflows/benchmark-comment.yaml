name: Benchmark comment

# Runs in the context of the base repository so it can comment on PRs from forks, where the
# Benchmark workflow itself only has a read-only token. Never checks out or runs PR code.
on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq "map(select(.head.sha == \"$HEAD_SHA\")) | .[0].number // empty")
          if [ -z "$number" ]; then
            echo "No open pull request found for $HEAD_OWNER:$HEAD_BRANCH at $HEAD_SHA, it was probably updated or closed."
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.pr.outputs.number != ''
        with:
          header: konfetti-benchmark
          number: ${{ steps.pr.outputs.number }}
          path: results/report.md

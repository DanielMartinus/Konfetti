name: Pages

# Builds the playground for the browser and publishes it as danielmartinus.github.io/Konfetti
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, a newer push waits for the running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the site
        run: ./gradlew :samples:multiplatform:composeApp:wasmJsBrowserDistribution --console=plain

      - uses: actions/upload-pages-artifact@v3
        with:
          path: samples/multiplatform/composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

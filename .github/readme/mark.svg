<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="72" height="72" role="img" aria-label="Konfetti"><title>Konfetti</title><style>.m{transform-box:fill-box;transform-origin:center}@keyframes a{50%{transform:translate(0,-1.2px) rotate(-14deg)}}@keyframes b{50%{transform:translate(.6px,1px) scale(.82)}}@keyframes c{50%{transform:translate(-.8px,.6px) rotate(10deg)}}@keyframes d{50%{transform:translate(.4px,-1px) rotate(24deg)}}.a{animation:a 3.1s ease-in-out infinite}.b{animation:b 2.6s ease-in-out infinite}.c2{animation:c 3.5s ease-in-out infinite}.d{animation:d 2.9s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m a"><rect x="2" y="3" width="5" height="5" rx="1" fill="#FCE18A" transform="rotate(-15 4 5)"/></g><circle class="m b" cx="13" cy="5" r="2.6" fill="#FF726D"/><rect class="m c2" x="3" y="11" width="6" height="3" rx="1" fill="#B48DEF"/><polygon class="m d" points="13,10 16,15 10,15" fill="#F4306D"/></svg>
